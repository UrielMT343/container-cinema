apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcinema-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/UrielMT343/container-cinema.git'
    targetRevision: HEAD
    path: deploy/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
